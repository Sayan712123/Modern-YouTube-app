name: Build Android 13 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build YouTube Android 13 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          sudo mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          sudo chmod -R a+rwX "$ANDROID_HOME"

      - name: Install web dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Capacitor Android shell
        run: |
          rm -rf android
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "YouTube" com.example.youtube --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Build Android 13 APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
