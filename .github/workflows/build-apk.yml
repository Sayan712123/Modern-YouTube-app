name: Build Android 13 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build YouTube Android 13 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Android 13 APK with Gradle
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Collect Output APKs
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/*.apk output-apk/YouTube-Android13-API33.apk
          ls -la output-apk

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Android13-API33-APK
          path: output-apk/*.apk
          if-no-files-found: error
